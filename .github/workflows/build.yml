name: Build PlayerPulse

# 放到仓库的 .github/workflows/build.yml（覆盖原文件）
# 跑在 Ubuntu 上：不用 macOS、不碰 brew，快且稳

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.build_variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_variant: rootless
          # - build_variant: rootful
          # - build_variant: roothide

    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: 安装编译工具链
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates xz-utils fakeroot \
            dpkg-dev clang lld make perl python3 unzip
          sudo curl -fsSL -o /usr/local/bin/ldid \
            https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          sudo chmod +x /usr/local/bin/ldid
          ldid -v 2>&1 | head -2 || true
          clang --version | head -1
          ld64.lld --version 2>&1 | head -1 || ld64.lld -v 2>&1 | head -1 || true
          dpkg-deb --version | head -1

      - name: 拉 Theos (roothide fork)
        run: |
          set -eux
          git clone --depth 1 --recursive https://github.com/roothide/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/theos/bin" >> "$GITHUB_PATH"
          test -f "$GITHUB_WORKSPACE/theos/vendor/lib/libsubstrate.tbd"
          ls -1 "$GITHUB_WORKSPACE/theos/vendor/lib" | head -30

      - name: 拉 iPhoneOS 16.5 SDK
        run: |
          set -eux
          mkdir -p "$THEOS/sdks"
          STAGE="$(mktemp -d)"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$STAGE/sdks"
          git -C "$STAGE/sdks" sparse-checkout set iPhoneOS16.5.sdk
          test -d "$STAGE/sdks/iPhoneOS16.5.sdk"
          cp -R "$STAGE/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          test -f "$THEOS/sdks/iPhoneOS16.5.sdk/SDKSettings.plist"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/Preferences.framework"
          du -sh "$THEOS/sdks/iPhoneOS16.5.sdk"

      - name: 整理 control
        id: meta
        run: |
          set -eux
          VERSION="5.2.0-${{ github.run_number }}"
          sed -i "s/^Version:.*/Version: ${VERSION}/" control
          sed -i 's/^Sileodepiction:/SileoDepiction:/' control
          case "${{ matrix.build_variant }}" in
            rootful) ARCH="iphoneos-arm" ;;
            *)       ARCH="iphoneos-arm64" ;;
          esac
          sed -i "s/^Architecture:.*/Architecture: ${ARCH}/" control
          cat control
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 编译打包
        run: |
          set -uo pipefail
          export FINALPACKAGE=1 DEBUG=0
          set +e
          bash build.sh "${{ matrix.build_variant }}" 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "=== exit code: $RC"
          ls -la packages 2>/dev/null || true
          {
            echo "## Build (${{ matrix.build_variant }}) — exit \`$RC\`"
            echo ""
            echo '```'
            tail -n 80 build.log 2>/dev/null || echo "(no build.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC

      - name: 上传 deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.build_variant }}
          path: packages/*.deb
          if-no-files-found: warn
          retention-days: 14

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.build_variant }}
          path: build.log
          if-no-files-found: warn
          retention-days: 14

      - name: 发 Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v${{ steps.meta.outputs.version }}
          name: "律动播放器 v${{ steps.meta.outputs.version }}"
          files: packages/*.deb
