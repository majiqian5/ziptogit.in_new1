name: Build PlayerPulse
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos official
        uses: theos/setup-theos@v1
        with:
          scheme: rootless

      - name: Build tweak
        run: |
          cd playerpulse
          make clean
          make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: PlayerPulse-rootless
          path: playerpulse/packages/*.deb
