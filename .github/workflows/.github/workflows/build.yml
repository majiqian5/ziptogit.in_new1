name: Build Tweak
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        uses: theos/setup-theos@v1
        with:
          scheme: rootless
      - name: Build package
        run: |
          make clean
          make package FINALPACKAGE=1
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: tweak-deb
          path: packages/*.deb
